<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>比奇堡登录 · 蟹堡王员工通道</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sea-deep:   #0B4F6C;
    --sea-mid:    #0197B2;
    --sea-light:  #6FE3F5;
    --sand:       #F3DCA2;
    --sand-dark:  #E3C57C;
    --sponge:     #FFDC3C;
    --sponge-dk:  #D9A400;
    --pants:      #8B5A2B;
    --shirt:      #FFFDF7;
    --tie:        #E63946;
    --text:       #0F3B4C;
    --muted:      #6E93A3;
    --card:       #FFFCF2;
    --btn-a:      #00B4DB;
    --btn-b:      #0077A8;
  }

  html, body { height: 100%; }

  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #05384A;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ============ 海底场景 ============ */
  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, #A8F0FF 0%, rgba(168,240,255,0) 55%),
      linear-gradient(180deg, #7FE8FA 0%, #35BEE0 28%, #0197B2 58%, #0B6A8C 80%, #04607F 100%);
    z-index: 0;
  }

  /* 水面光柱 */
  .sunrays {
    position: absolute;
    top: -20%;
    left: 50%;
    width: 140%;
    height: 160%;
    transform: translateX(-50%);
    background: repeating-linear-gradient(
      100deg,
      rgba(255,255,255,0.16) 0px,
      rgba(255,255,255,0.16) 34px,
      rgba(255,255,255,0) 34px,
      rgba(255,255,255,0) 96px
    );
    animation: rayDrift 14s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes rayDrift {
    from { transform: translateX(-56%) skewX(-4deg); }
    to   { transform: translateX(-44%) skewX(4deg); }
  }

  /* 水面波光 */
  .surface {
    position: absolute;
    top: 0; left: -10%;
    width: 120%; height: 90px;
    background: radial-gradient(ellipse 60% 100% at 50% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%);
    animation: shimmer 5s ease-in-out infinite alternate;
  }
  @keyframes shimmer { from { opacity: .55; } to { opacity: .95; } }

  /* 远处菠萝屋 */
  .pineapple {
    position: absolute;
    bottom: 78px;
    left: 7%;
    width: 130px;
    animation: floaty 7s ease-in-out infinite;
    opacity: .9;
  }
  .rock-house {
    position: absolute;
    bottom: 70px;
    right: 6%;
    width: 150px;
    animation: floaty 8.5s ease-in-out infinite reverse;
    opacity: .85;
  }
  @keyframes floaty {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    50%     { transform: translateY(-14px) rotate(1deg); }
  }

  /* 海床沙地 */
  .sand {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 140px;
    background: linear-gradient(180deg, var(--sand) 0%, var(--sand-dark) 100%);
    border-top-left-radius: 50% 26px;
    border-top-right-radius: 46% 34px;
    box-shadow: inset 0 12px 24px rgba(255,255,255,.35);
  }
  .sand::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 12% 40%, rgba(200,160,90,.35) 3px, transparent 4px),
      radial-gradient(circle at 30% 70%, rgba(200,160,90,.3) 4px, transparent 5px),
      radial-gradient(circle at 58% 35%, rgba(200,160,90,.28) 3px, transparent 4px),
      radial-gradient(circle at 76% 68%, rgba(200,160,90,.3) 5px, transparent 6px),
      radial-gradient(circle at 91% 42%, rgba(200,160,90,.25) 4px, transparent 5px);
  }

  /* 海草 */
  .weed {
    position: absolute;
    bottom: 118px;
    width: 16px;
    height: 110px;
    background: linear-gradient(180deg, #4CC38A, #2E8B62);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    transform-origin: bottom center;
    animation: sway 3.4s ease-in-out infinite alternate;
  }
  .weed.w2 { bottom: 126px; left: 22%; height: 88px;  animation-duration: 2.8s; }
  .weed.w3 { bottom: 120px; left: 78%; height: 128px; animation-duration: 4.2s; }
  .weed.w4 { bottom: 130px; left: 34%; height: 62px;  animation-duration: 3.1s; }
  .weed.w5 { bottom: 122px; left: 66%; height: 96px;  animation-duration: 3.8s; }
  .weed.w1 { left: 12%; }
  @keyframes sway {
    from { transform: rotate(-9deg) scaleY(.96); }
    to   { transform: rotate(11deg) scaleY(1.04); }
  }

  /* 气泡 */
  .bubble {
    position: absolute;
    bottom: -30px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(255,255,255,.18) 55%, rgba(255,255,255,.05) 70%);
    border: 1px solid rgba(255,255,255,.6);
    animation: rise linear infinite;
    pointer-events: none;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0) scale(.7); opacity: 0; }
    8%   { opacity: .9; }
    50%  { transform: translate(18px, -50vh) scale(1); }
    88%  { opacity: .8; }
    100% { transform: translate(-14px, -105vh) scale(1.15); opacity: 0; }
  }

  /* 小鱼 */
  .fish {
    position: absolute;
    width: 34px;
    animation: swim linear infinite;
  }
  @keyframes swim {
    0%   { transform: translateX(-15vw) translateY(0) scaleX(1); }
    49%  { transform: translateX(105vw) translateY(-18px) scaleX(1); }
    50%  { transform: translateX(105vw) translateY(-18px) scaleX(-1); }
    100% { transform: translateX(-15vw) translateY(10px) scaleX(-1); }
  }

  /* ============ 登录卡片 ============ */
  .stage {
    position: relative;
    z-index: 3;
    width: min(940px, 94vw);
    margin: 28px auto;
  }

  .card {
    display: grid;
    grid-template-columns: 0.92fr 1.08fr;
    background: var(--card);
    border: 5px solid #FFFFFF;
    border-radius: 36px;
    overflow: hidden;
    box-shadow:
      0 30px 60px -18px rgba(3, 45, 66, .55),
      0 0 0 8px rgba(255, 220, 60, .28),
      inset 0 2px 0 rgba(255,255,255,.9);
    animation: cardIn .8s cubic-bezier(.2,1.2,.3,1) both;
  }
  @keyframes cardIn {
    from { transform: translateY(38px) scale(.96); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  /* ---- 左侧角色区 ---- */
  .hero {
    position: relative;
    padding: 30px 20px 0;
    background:
      radial-gradient(circle at 50% 22%, #BFF3FF 0%, rgba(191,243,255,0) 62%),
      linear-gradient(180deg, #4FD4EC 0%, #12A2C4 55%, #0A7FA5 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  .hero-sand {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 96px;
    background: linear-gradient(180deg, #F5E0AC, #E1C079);
    border-radius: 52% 48% 0 0 / 34px 26px 0 0;
  }
  .hero-title {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #fff;
    text-shadow: 0 3px 0 rgba(2, 74, 96, .45);
    margin-bottom: 4px;
  }
  .hero-title h2 { font-size: 22px; letter-spacing: 1px; }
  .hero-title p  { font-size: 12.5px; opacity: .9; margin-top: 4px; }

  .avatar {
    position: relative;
    z-index: 2;
    width: min(250px, 62%);
    filter: drop-shadow(0 12px 14px rgba(0,50,70,.35));
    animation: bob 3.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-1.2deg); }
    50%     { transform: translateY(-13px) rotate(1.2deg); }
  }
  .avatar svg { width: 100%; height: auto; display: block; }

  /* SVG 角色动画 */
  .char-arm-right { transform-box: fill-box; transform-origin: 12% 88%; animation: wave 2.2s ease-in-out infinite; }
  .char-arm-left  { transform-box: fill-box; transform-origin: 88% 88%; animation: wave 2.2s ease-in-out infinite reverse; }
  @keyframes wave {
    0%,100% { transform: rotate(-10deg); }
    50%     { transform: rotate(16deg); }
  }
  .char-eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(.08); }
  }
  .char-legs { transform-box: fill-box; transform-origin: top center; animation: tap 1.1s ease-in-out infinite alternate; }
  @keyframes tap { from { transform: scaleY(1); } to { transform: scaleY(.94); } }

  .hero-badge {
    position: relative;
    z-index: 2;
    margin: 6px 0 26px;
    padding: 7px 16px;
    border-radius: 999px;
    background: var(--sponge);
    color: #5A3E00;
    font-size: 12.5px;
    font-weight: bold;
    box-shadow: 0 4px 0 #C79A15;
    transform: rotate(-3deg);
  }

  /* ---- 右侧表单区 ---- */
  .panel {
    padding: 40px 46px 34px;
    background: var(--card);
  }

  .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .logo-badge {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: linear-gradient(145deg, #FFE96B, var(--sponge-dk));
    display: grid; place-items: center;
    box-shadow: 0 5px 0 #B98C05, inset 0 2px 0 rgba(255,255,255,.7);
    transform: rotate(-6deg);
  }
  .logo-row h1 { font-size: 25px; color: var(--text); line-height: 1.15; letter-spacing: .5px; }
  .logo-row span { display: block; font-size: 12px; color: var(--muted); font-weight: normal; letter-spacing: 0; }

  .field { position: relative; margin-bottom: 16px; }
  .field input {
    width: 100%;
    height: 58px;
    padding: 20px 50px 6px 50px;
    border: 2.5px solid #DCEAF0;
    border-radius: 20px;
    background: #fff;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field label {
    position: absolute;
    left: 50px; top: 19px;
    font-size: 14.5px;
    color: var(--muted);
    pointer-events: none;
    transition: .18s ease;
  }
  .field input:focus { border-color: var(--sea-mid); background: #FBFEFF; box-shadow: 0 0 0 5px rgba(1,151,178,.14); }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label {
    top: 8px; font-size: 11.5px; color: var(--sea-mid); letter-spacing: .4px;
  }
  .field .ico {
    position: absolute; left: 17px; top: 50%;
    transform: translateY(-50%);
    width: 22px; height: 22px;
    color: #9FBFCB;
    transition: color .2s;
  }
  .field input:focus ~ .ico { color: var(--sea-mid); }
  .toggle-eye {
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    width: 34px; height: 34px;
    border: none; background: none;
    border-radius: 50%;
    cursor: pointer;
    color: #9FBFCB;
    display: grid; place-items: center;
    transition: background .2s, color .2s;
  }
  .toggle-eye:hover { background: #EAF6F9; color: var(--sea-mid); }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    margin: 6px 0 22px;
    font-size: 13.5px;
  }
  .remember { display: flex; align-items: center; gap: 9px; cursor: pointer; color: #4B7484; user-select: none; }
  .remember input { display: none; }
  .box {
    width: 22px; height: 22px;
    border: 2.5px solid #DCEAF0;
    border-radius: 8px;
    background: #fff;
    display: grid; place-items: center;
    transition: .2s;
  }
  .box svg { width: 14px; height: 14px; color: #fff; opacity: 0; transform: scale(.4); transition: .2s; }
  .remember input:checked + .box { background: var(--sea-mid); border-color: var(--sea-mid); }
  .remember input:checked + .box svg { opacity: 1; transform: scale(1); }
  .forgot { color: var(--sea-mid); text-decoration: none; font-weight: bold; }
  .forgot:hover { text-decoration: underline; }

  .submit {
    width: 100%;
    height: 58px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(180deg, #22C6DE, var(--btn-b));
    color: #fff;
    font: inherit;
    font-size: 17.5px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 6px 0 #04607F, 0 14px 24px -8px rgba(4,96,127,.6);
    transition: transform .12s, box-shadow .12s, filter .2s;
  }
  .submit:hover { filter: brightness(1.07); transform: translateY(-2px); box-shadow: 0 8px 0 #04607F, 0 18px 28px -8px rgba(4,96,127,.6); }
  .submit:active { transform: translateY(5px); box-shadow: 0 1px 0 #04607F; }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0 16px;
    color: #B3C9D2; font-size: 12px;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 2px; background: #E7F0F4; border-radius: 2px; }

  .social { display: flex; gap: 12px; }
  .social button {
    flex: 1; height: 50px;
    border: 2.5px solid #E3EEF3;
    border-radius: 16px;
    background: #fff;
    font: inherit; font-size: 13.5px; font-weight: bold;
    color: #4B7484;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: .2s;
  }
  .social button:hover { border-color: var(--sea-light); transform: translateY(-2px); box-shadow: 0 8px 16px -8px rgba(1,151,178,.5); }

  .foot { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--muted); }
  .foot a { color: var(--sea-mid); font-weight: bold; text-decoration: none; }
  .foot a:hover { text-decoration: underline; }

  /* 抖动 + 错误提示 */
  .shake { animation: shake .45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    15% { transform: translateX(-9px); } 30% { transform: translateX(8px); }
    45% { transform: translateX(-6px); } 60% { transform: translateX(5px); }
    80% { transform: translateX(-3px); }
  }
  .err {
    color: #D92B3A; font-size: 12.5px;
    margin: -6px 0 12px 6px;
    display: none;
  }
  .err.show { display: block; animation: pop .3s; }
  @keyframes pop { from { transform: translateY(-4px); opacity: 0; } to { transform: none; opacity: 1; } }
  .field.invalid input { border-color: #E8909A; background: #FFF6F6; }

  /* ============ 成功态 ============ */
  .success {
    position: absolute; inset: 0;
    background: linear-gradient(160deg, #4FD4EC, #0A7FA5);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    color: #fff;
    text-align: center;
    opacity: 0; visibility: hidden;
    transition: opacity .45s, visibility .45s;
    z-index: 5;
  }
  .success.on { opacity: 1; visibility: visible; }
  .tick {
    width: 92px; height: 92px;
    border-radius: 50%;
    background: var(--sponge);
    display: grid; place-items: center;
    box-shadow: 0 0 0 12px rgba(255,220,60,.28), 0 10px 24px rgba(0,0,0,.2);
    animation: pop .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  .success h3 { font-size: 24px; text-shadow: 0 3px 0 rgba(2,74,96,.35); }
  .success p  { font-size: 14px; opacity: .92; }
  .mini-btn {
    margin-top: 10px;
    padding: 11px 26px;
    border: none; border-radius: 999px;
    background: #fff; color: #0A7FA5;
    font: inherit; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.12);
  }
  .mini-btn:active { transform: translateY(3px); box-shadow: none; }

  /* 卡片整体在处理中 */
  .card.busy .panel { filter: saturate(.55); pointer-events: none; }

  /* 响应式 */
  @media (max-width: 860px) {
    .card { grid-template-columns: 1fr; border-radius: 28px; }
    .hero { padding: 22px 16px 0; }
    .avatar { width: 190px; }
    .hero-badge { margin-bottom: 18px; }
    .panel { padding: 30px 26px 28px; }
    .pineapple, .rock-house { display: none; }
  }
</style>
</head>
<body>

<!-- ============ 背景场景 ============ -->
<div class="scene">
  <div class="surface"></div>
  <div class="sunrays"></div>

  <!-- 菠萝屋 -->
  <svg class="pineapple" viewBox="0 0 120 150" aria-hidden="true">
    <ellipse cx="60" cy="146" rx="52" ry="7" fill="rgba(0,0,0,.13)"/>
    <path d="M60 12 q16 14 16 34 q0 22 -16 40 q-16 -18 -16 -40 q0 -20 16 -34 z" fill="#4CAF6D" opacity=".85"/>
    <path d="M60 20 q22 16 22 40 q0 26 -22 46 q-22 -20 -22 -46 q0 -24 22 -40 z" fill="#8CC63F"/>
    <ellipse cx="60" cy="76" rx="34" ry="48" fill="#E8A33D"/>
    <g fill="#C98A26" opacity=".75">
      <ellipse cx="46" cy="60" rx="4" ry="5"/><ellipse cx="72" cy="60" rx="4" ry="5"/>
      <ellipse cx="60" cy="76" rx="4" ry="5"/><ellipse cx="46" cy="92" rx="4" ry="5"/>
      <ellipse cx="72" cy="92" rx="4" ry="5"/><ellipse cx="60" cy="106" rx="4" ry="5"/>
    </g>
    <rect x="50" y="112" width="20" height="24" rx="4" fill="#8B5A2B"/>
    <circle cx="54" cy="122" r="3" fill="#5E3B18"/>
    <path d="M34 118 q26 -12 52 0" stroke="#6B8F2A" stroke-width="3" fill="none" opacity=".7"/>
  </svg>

  <!-- 石头屋 -->
  <svg class="rock-house" viewBox="0 0 150 130" aria-hidden="true">
    <ellipse cx="75" cy="126" rx="58" ry="8" fill="rgba(0,0,0,.13)"/>
    <rect x="30" y="70" width="90" height="56" rx="16" fill="#7E8A8F"/>
    <path d="M20 72 L75 34 L130 72 Z" fill="#96A2A7"/>
    <rect x="62" y="90" width="26" height="36" rx="6" fill="#5F6A70"/>
    <circle cx="44" cy="96" r="8" fill="#CDE8EF" stroke="#5F6A70" stroke-width="3"/>
    <circle cx="106" cy="96" r="8" fill="#CDE8EF" stroke="#5F6A70" stroke-width="3"/>
    <rect x="66" y="36" width="14" height="22" rx="5" fill="#5F6A70"/>
  </svg>

  <div class="weed w1"></div>
  <div class="weed w2"></div>
  <div class="weed w3"></div>
  <div class="weed w4"></div>
  <div class="weed w5"></div>

  <!-- 小鱼 -->
  <svg class="fish" style="left:0; top:34%; animation-duration:17s" viewBox="0 0 44 26">
    <path d="M34 13 L44 4 L44 22 Z" fill="#FF9A3C"/>
    <ellipse cx="20" cy="13" rx="20" ry="10" fill="#FFB44D"/>
    <circle cx="10" cy="10" r="3" fill="#fff"/><circle cx="10" cy="10" r="1.6" fill="#123"/>
  </svg>
  <svg class="fish" style="left:0; top:64%; animation-duration:23s; animation-delay:-6s" viewBox="0 0 44 26">
    <path d="M34 13 L44 4 L44 22 Z" fill="#FF6B8B"/>
    <ellipse cx="20" cy="13" rx="20" ry="10" fill="#FF8FA8"/>
    <circle cx="10" cy="10" r="3" fill="#fff"/><circle cx="10" cy="10" r="1.6" fill="#123"/>
  </svg>

  <div class="sand"></div>
  <div id="bubbles"></div>
</div>

<!-- ============ 登录卡 ============ -->
<div class="stage">
  <div class="card" id="card">

    <!-- 左：角色 -->
    <div class="hero">
      <div class="hero-title">
        <h2>欢迎回到比奇堡</h2>
        <p>今天也要开心地煎蟹黄堡哦</p>
      </div>

      <div class="avatar">
        <svg viewBox="0 0 260 320" aria-label="海绵主题卡通角色">
          <!-- 影子 -->
          <ellipse cx="130" cy="300" rx="76" ry="10" fill="rgba(0,0,0,.16)"/>

          <!-- 手臂（后层） -->
          <g class="char-arm-left">
            <path d="M56 132 C 30 128 24 104 30 88" stroke="#C99A05" stroke-width="19" fill="none" stroke-linecap="round"/>
            <path d="M56 132 C 30 128 24 104 30 88" stroke="#FFDC3C" stroke-width="13" fill="none" stroke-linecap="round"/>
            <circle cx="30" cy="86" r="12" fill="#FFDC3C" stroke="#C99A05" stroke-width="4"/>
          </g>
          <g class="char-arm-right">
            <path d="M204 132 C 230 128 236 104 230 88" stroke="#C99A05" stroke-width="19" fill="none" stroke-linecap="round"/>
            <path d="M204 132 C 230 128 236 104 230 88" stroke="#FFDC3C" stroke-width="13" fill="none" stroke-linecap="round"/>
            <circle cx="230" cy="86" r="12" fill="#FFDC3C" stroke="#C99A05" stroke-width="4"/>
          </g>

          <!-- 身体 -->
          <rect x="42" y="46" width="176" height="152" rx="20" fill="#FFDC3C" stroke="#C99A05" stroke-width="5"/>
          <g fill="#E0AE12" opacity=".55">
            <ellipse cx="70"  cy="80"  rx="12" ry="9"/>
            <ellipse cx="190" cy="92"  rx="10" ry="8"/>
            <ellipse cx="62"  cy="170" rx="9"  ry="7"/>
            <ellipse cx="196" cy="164" rx="11" ry="8"/>
            <ellipse cx="130" cy="62"  rx="8"  ry="6"/>
            <ellipse cx="86"  cy="188" rx="7"  ry="6"/>
            <ellipse cx="170" cy="188" rx="8"  ry="6"/>
          </g>

          <!-- 腮红 -->
          <ellipse cx="74"  cy="152" rx="15" ry="9" fill="#FF8FA3" opacity=".45"/>
          <ellipse cx="186" cy="152" rx="15" ry="9" fill="#FF8FA3" opacity=".45"/>

          <!-- 眼睛 -->
          <g class="char-eyes">
            <circle cx="100" cy="105" r="27" fill="#fff" stroke="#2B2B2B" stroke-width="4"/>
            <circle cx="160" cy="105" r="27" fill="#fff" stroke="#2B2B2B" stroke-width="4"/>
            <circle cx="104" cy="108" r="13" fill="#2196F3"/>
            <circle cx="164" cy="108" r="13" fill="#2196F3"/>
            <circle cx="104" cy="108" r="6"  fill="#111"/>
            <circle cx="164" cy="108" r="6"  fill="#111"/>
            <circle cx="109" cy="102" r="4"  fill="#fff"/>
            <circle cx="169" cy="102" r="4"  fill="#fff"/>
          </g>

          <!-- 鼻子 -->
          <path d="M126 132 q10 0 6 13 q-3 5 -7 1" fill="none" stroke="#C99A05" stroke-width="4" stroke-linecap="round"/>

          <!-- 嘴 + 牙 -->
          <path d="M104 152 q26 26 54 0" fill="none" stroke="#7A4A12" stroke-width="4" stroke-linecap="round"/>
          <path d="M118 164 h8 v11 h-8 z" fill="#fff" stroke="#C99A05" stroke-width="2"/>
          <path d="M136 164 h8 v11 h-8 z" fill="#fff" stroke="#C99A05" stroke-width="2"/>

          <!-- 衬衫 + 领带 -->
          <rect x="44" y="160" width="172" height="24" rx="8" fill="#FFFDF7" stroke="#D9CDB8" stroke-width="3"/>
          <path d="M108 161 L130 184 L92 184 Z" fill="#FFFDF7" stroke="#D9CDB8" stroke-width="3"/>
          <path d="M152 161 L168 184 L130 184 Z" fill="#FFFDF7" stroke="#D9CDB8" stroke-width="3"/>
          <path d="M130 182 L142 196 L130 208 L118 196 Z" fill="#E63946" stroke="#A81F2B" stroke-width="3"/>

          <!-- 裤子 -->
          <rect x="44" y="178" width="172" height="10" rx="4" fill="#2E2E2E"/>
          <path d="M46 186 H214 L200 232 H60 Z" fill="#8B5A2B" stroke="#5E3B18" stroke-width="4"/>
          <rect x="60" y="212" width="12" height="18" rx="4" fill="#2E2E2E"/>
          <rect x="188" y="212" width="12" height="18" rx="4" fill="#2E2E2E"/>

          <!-- 腿 + 鞋 -->
          <g class="char-legs">
            <rect x="88"  y="222" width="18" height="42" fill="#FFDC3C" stroke="#C99A05" stroke-width="4"/>
            <rect x="154" y="222" width="18" height="42" fill="#FFDC3C" stroke="#C99A05" stroke-width="4"/>
            <ellipse cx="88"  cy="272" rx="26" ry="12" fill="#333" stroke="#111" stroke-width="3"/>
            <ellipse cx="172" cy="272" rx="26" ry="12" fill="#333" stroke="#111" stroke-width="3"/>
          </g>
        </svg>
      </div>

      <div class="hero-badge">I'M READY! 今天也元气满满</div>
      <div class="hero-sand"></div>
    </div>

    <!-- 右：表单 -->
    <div class="panel">
      <div class="logo-row">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="#5A3E00">
            <path d="M4 6h16a2 2 0 0 1 2 2v2a4 4 0 0 1 0 8v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-2a4 4 0 0 1 0-8V8a2 2 0 0 1 2-2zm3 5v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/>
          </svg>
        </div>
        <h1>员工登录<span>蟹堡王 · 比奇堡分店</span></h1>
      </div>

      <form id="loginForm" novalidate>
        <div class="field" id="fUser">
          <input type="text" id="username" placeholder=" " autocomplete="username">
          <label for="username">员工账号</label>
          <svg class="ico" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.4-8 5.3V21h16v-1.7c0-2.9-3.6-5.3-8-5.3z"/>
          </svg>
        </div>
        <p class="err" id="eUser">请输入员工账号呀，别害羞</p>

        <div class="field" id="fPass">
          <input type="password" id="password" placeholder=" " autocomplete="current-password">
          <label for="password">密码</label>
          <svg class="ico" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 12a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
          </svg>
          <button type="button" class="toggle-eye" id="eyeBtn" aria-label="显示密码">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" id="eyeIcon">
              <path d="M12 5C6.5 5 2.5 9.3 1 12c1.5 2.7 5.5 7 11 7s9.5-4.3 11-7c-1.5-2.7-5.5-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
            </svg>
          </button>
        </div>
        <p class="err" id="ePass">密码不能为空哦</p>

        <div class="row">
          <label class="remember">
            <input type="checkbox" id="remember" checked>
            <span class="box">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
            </span>
            记住我
          </label>
          <a href="#" class="forgot">忘记密码？</a>
        </div>

        <button class="submit" type="submit" id="submitBtn">出 发 !</button>
      </form>

      <div class="divider">或者用其他方式进入</div>
      <div class="social">
        <button type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="#4CC38A"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm3.6 6.2-1.4 4.7a3 3 0 0 1-2.9 2.1H8.6l.6 2H6.8L5 8.2h3.2l-.3 1.2h3.1a1.4 1.4 0 0 1 1.4.9l.5 1.8 1-1.2-1.3-2.7h2z"/></svg>
          派大星账号
        </button>
        <button type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="#FF9500"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 5h2v6h3v2h-5V7zm1 11a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
          松鼠飞码
        </button>
      </div>

      <p class="foot">还没有工作证？<a href="#">申请加入蟹堡王</a></p>
    </div>

    <!-- 成功遮罩 -->
    <div class="success" id="success">
      <div class="tick">
        <svg viewBox="0 0 24 24" width="52" height="52" fill="#5A3E00"><path d="M9 16.2 4.8 12l-1.8 1.8L9 19.8 21 7.8 19.2 6z"/></svg>
      </div>
      <h3>欢迎回来，蟹黄堡大厨！</h3>
      <p id="successMsg">正在前往厨房，请把锅铲拿好</p>
      <button class="mini-btn" id="againBtn">再登一次</button>
    </div>
  </div>
</div>

<script>
  // ---- 气泡生成 ----
  const bubbleBox = document.getElementById('bubbles');
  const sizes = [12, 16, 22, 28, 34, 44];
  for (let i = 0; i < 26; i++) {
    const b = document.createElement('div');
    const s = sizes[Math.floor(Math.random() * sizes.length)];
    b.className = 'bubble';
    b.style.width = s + 'px';
    b.style.height = s + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.animationDuration = (7 + Math.random() * 9) + 's';
    b.style.animationDelay = (-Math.random() * 12) + 's';
    b.style.opacity = 0.35 + Math.random() * 0.5;
    bubbleBox.appendChild(b);
  }

  // ---- 密码可见切换 ----
  const passInput = document.getElementById('password');
  const eyeBtn = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  const EYE_ON = 'M12 5C6.5 5 2.5 9.3 1 12c1.5 2.7 5.5 7 11 7s9.5-4.3 11-7c-1.5-2.7-5.5-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z';
  const EYE_OFF = 'M2.8 2.1 1.4 3.5l3 3C2.7 8 1.4 10 1 10.6 2.5 13.3 6.5 17.6 12 17.6c1.8 0 3.4-.5 4.8-1.2l3.7 3.7 1.4-1.4L2.8 2.1zM12 15.6c-2.8 0-5.2-2-6.2-4 .5-.9 1.5-2 2.9-2.9l1.2 1.2A3 3 0 0 0 14 12.9l1.3 1.3c-.6.2-1.1.3-1.6.3 0 0 1 1-1.7 1zM12 5c5.5 0 9.5 4.3 11 7-.6 1.1-1.8 2.6-3.4 3.8l1.5 1.5C22.6 15.7 23 12.6 23 10.6 21.5 7.9 17.5 3.6 12 3.6c-1.3 0-2.5.3-3.6.7L10 5.8c.6-.2 1.3-.3 2-.3z';
  eyeBtn.addEventListener('click', () => {
    const show = passInput.type === 'password';
    passInput.type = show ? 'text' : 'password';
    eyeIcon.querySelector('path').setAttribute('d', show ? EYE_OFF : EYE_ON);
  });

  // ---- 提交校验 ----
  const form = document.getElementById('loginForm');
  const card = document.getElementById('card');
  const user = document.getElementById('username');
  const eUser = document.getElementById('eUser');
  const ePass = document.getElementById('ePass');
  const fUser = document.getElementById('fUser');
  const fPass = document.getElementById('fPass');
  const submitBtn = document.getElementById('submitBtn');

  function fail(field, tip) {
    field.classList.remove('shake');
    void field.offsetWidth;
    field.classList.add('shake');
    tip.classList.add('show');
    field.classList.add('invalid');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let ok = true;

    if (!user.value.trim()) {
      fail(fUser, eUser); ok = false;
    } else {
      eUser.classList.remove('show'); fUser.classList.remove('invalid');
    }

    if (!passInput.value) {
      fail(fPass, ePass); ok = false;
    } else if (passInput.value.length < 6) {
      ePass.textContent = '密码至少 6 位，再想想';
      fail(fPass, ePass); ok = false;
    } else {
      ePass.classList.remove('show'); fPass.classList.remove('invalid');
    }

    if (!ok) return;

    card.classList.add('busy');
    submitBtn.textContent = '准 备 中 ...';
    setTimeout(() => {
      document.getElementById('successMsg').textContent =
        '欢迎你，' + user.value.trim() + '！正在前往厨房，请把锅铲拿好';
      document.getElementById('success').classList.add('on');
      card.classList.remove('busy');
      submitBtn.textContent = '出 发 !';
    }, 900);
  });

  [user, passInput].forEach(el => {
    el.addEventListener('input', () => {
      const tip = el === user ? eUser : ePass;
      const field = el === user ? fUser : fPass;
      tip.classList.remove('show');
      field.classList.remove('invalid');
    });
  });

  document.getElementById('againBtn').addEventListener('click', () => {
    document.getElementById('success').classList.remove('on');
    user.value = ''; passInput.value = '';
    setTimeout(() => user.focus(), 500);
  });

  user.focus();
</script>
</body>
</html>
