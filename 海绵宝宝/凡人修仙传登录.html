<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凡人修仙传 · 踏入仙途</title>
<style>
  :root{
    --bg-0:#070a14;
    --bg-1:#0d1426;
    --bg-2:#141d36;
    --qi:#67e8f9;        /* 灵气青 */
    --gold:#e9c878;      /* 仙金 */
    --gold-2:#f5dd9b;
    --violet:#8b6dff;    /* 紫霄 */
    --ink:#e9eefb;
    --ink-dim:#8b9bbd;
    --line:rgba(140,170,220,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Serif SC","Songti SC","STSong",ui-serif,Georgia,serif;
    background:radial-gradient(120% 120% at 80% 10%,var(--bg-2) 0%,var(--bg-1) 45%,var(--bg-0) 100%);
    color:var(--ink);
    overflow:hidden;
    position:relative;
  }
  /* 灵气粒子层 */
  #qi{position:fixed;inset:0;z-index:0;pointer-events:none}
  /* 流光雾气 */
  .fog{
    position:fixed;inset:-20%;z-index:0;pointer-events:none;
    background:
      radial-gradient(40% 30% at 20% 80%,rgba(103,232,249,.10),transparent 70%),
      radial-gradient(45% 35% at 85% 20%,rgba(139,109,255,.12),transparent 70%);
    filter:blur(8px);
    animation:drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift{from{transform:translate3d(-2%,1%,0) scale(1)}to{transform:translate3d(2%,-1%,0) scale(1.06)}}

  .stage{
    position:relative;z-index:2;
    height:100%;width:100%;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .panel{
    display:flex;width:min(960px,94vw);height:min(620px,90vh);
    border-radius:22px;overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(233,200,120,.05) inset;
    backdrop-filter:blur(6px);
  }

  /* ===== 左侧意境（韩立背景） ===== */
  .visual{
    position:relative;flex:1.1;min-width:280px;
    padding:42px 38px;
    display:flex;flex-direction:column;justify-content:space-between;
    overflow:hidden;
    background:
      linear-gradient(100deg,rgba(7,10,20,.82) 0%,rgba(7,10,20,.5) 40%,rgba(7,10,20,.12) 68%,rgba(7,10,20,.6) 100%),
      url("hanli.png") center 22%/cover no-repeat;
    background-color:#070a14;
  }
  .visual::before{ /* 右缘渐隐，与登录区融合 */
    content:"";position:absolute;top:0;right:0;bottom:0;width:34%;
    background:linear-gradient(90deg,transparent,rgba(7,10,20,.7));
    pointer-events:none;z-index:0;
  }
  .visual::after{ /* 底部压暗，托住文字 */
    content:"";position:absolute;left:0;right:0;bottom:0;height:42%;
    background:linear-gradient(0deg,rgba(7,10,20,.85),transparent);
    pointer-events:none;z-index:0;
  }
  .visual .brand{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:3px;color:var(--gold)}
  .visual .brand .seal{
    width:30px;height:30px;border-radius:7px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--gold),#b88a3c);color:#1a1206;font-weight:700;
    box-shadow:0 0 18px rgba(233,200,120,.45);
  }
  .visual .title{
    position:relative;z-index:1;
    font-size:clamp(40px,6vw,68px);font-weight:700;line-height:1.05;
    letter-spacing:6px;margin-top:8px;
    background:linear-gradient(180deg,#fff7e6,var(--gold) 55%,#b98e34);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(233,200,120,.25);
  }
  .visual .subtitle{position:relative;z-index:1;color:var(--ink-dim);letter-spacing:4px;margin-top:14px;font-size:15px}
  .realms{
    position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;
  }
  .realms span{
    font-size:12.5px;letter-spacing:2px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line);color:var(--ink-dim);
    background:rgba(255,255,255,.02);transition:.3s;
  }
  .realms span.on{color:var(--gold);border-color:rgba(233,200,120,.5);box-shadow:0 0 16px rgba(233,200,120,.25)}
  .visual .foot{position:relative;z-index:1;color:var(--ink-dim);font-size:12px;letter-spacing:2px;opacity:.7}

  /* ===== 右侧登录 ===== */
  .form-side{
    flex:1;min-width:300px;display:grid;place-items:center;padding:36px;
    background:linear-gradient(180deg,rgba(20,29,54,.55),rgba(7,10,20,.65));
    position:relative;
  }
  .card{width:100%;max-width:330px;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .card h2{font-size:30px;letter-spacing:6px;margin-bottom:6px;
    background:linear-gradient(180deg,#fff,var(--qi));-webkit-background-clip:text;background-clip:text;color:transparent}
  .card .hint{color:var(--ink-dim);font-size:13px;letter-spacing:2px;margin-bottom:26px}
  .field{position:relative;margin-bottom:18px}
  .field .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-dim)}
  .field input{
    width:100%;padding:14px 14px 14px 44px;font-size:15px;color:var(--ink);
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;
    outline:none;transition:.25s;font-family:inherit;letter-spacing:1px;
  }
  .field input::placeholder{color:#5e6f93}
  .field input:focus{
    border-color:rgba(103,232,249,.6);
    box-shadow:0 0 0 3px rgba(103,232,249,.12),0 0 22px rgba(103,232,249,.18);
    background:rgba(103,232,249,.05);
  }
  .field .toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--ink-dim);user-select:none}
  .row{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 22px;font-size:13px}
  .row label{display:flex;align-items:center;gap:8px;color:var(--ink-dim);cursor:pointer;letter-spacing:1px}
  .row input{accent-color:var(--gold);width:15px;height:15px}
  .row a{color:var(--qi);text-decoration:none;opacity:.85}
  .row a:hover{opacity:1;text-shadow:0 0 12px rgba(103,232,249,.5)}

  .btn{
    width:100%;padding:15px;border:none;border-radius:12px;cursor:pointer;
    font-family:inherit;font-size:17px;letter-spacing:8px;font-weight:700;color:#0c1322;
    background:linear-gradient(135deg,var(--gold-2),var(--gold) 50%,#c79a44);
    position:relative;overflow:hidden;transition:.25s;
    box-shadow:0 10px 30px rgba(233,200,120,.30);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(233,200,120,.45)}
  .btn:active{transform:translateY(0)}
  .btn::after{ /* 扫光 */
    content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.65),transparent);
    transform:skewX(-20deg);animation:sheen 3.5s ease-in-out infinite;
  }
  @keyframes sheen{0%,60%{left:-120%}100%{left:160%}}
  .btn[disabled]{opacity:.7;cursor:progress}

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:rgba(13,20,38,.9);border:1px solid var(--line);color:var(--ink);
    padding:12px 22px;border-radius:12px;font-size:14px;letter-spacing:2px;
    opacity:0;pointer-events:none;transition:.35s;z-index:9;backdrop-filter:blur(8px);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:760px){
    .panel{flex-direction:column;height:auto}
    .visual{min-height:200px}
    .form-side{padding:30px}
  }
</style>
</head>
<body>
  <canvas id="qi"></canvas>
  <div class="fog"></div>

  <div class="stage">
    <div class="panel">
      <!-- 左：意境 -->
      <section class="visual">
        <div class="brand"><span class="seal">仙</span> 仙缘阁 · 通行令</div>
        <div>
          <h1 class="title">凡人<br>修仙传</h1>
          <p class="subtitle">凡人亦可逆天改命</p>
          <div class="realms" id="realms">
            <span class="on">炼气</span><span>筑基</span><span>金丹</span><span>元婴</span>
            <span>化神</span><span>炼虚</span><span>合体</span><span>大乘</span><span>渡劫</span>
          </div>
        </div>
        <div class="foot">青云之巅 · 一念成仙</div>
      </section>

      <!-- 右：登录 -->
      <section class="form-side">
        <form class="card" id="loginForm" autocomplete="off">
          <h2>踏入仙途</h2>
          <p class="hint">请输入道号与法诀，以证仙缘</p>

          <div class="field">
            <span class="ico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            </span>
            <input id="user" type="text" placeholder="道号 / 账号" required>
          </div>

          <div class="field">
            <span class="ico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <input id="pass" type="password" placeholder="法诀 / 密码" required>
            <span class="toggle" id="toggle">显</span>
          </div>

          <div class="row">
            <label><input type="checkbox" checked> 铭记道号</label>
            <a href="#" onclick="return false">遗忘法诀？</a>
          </div>

          <button class="btn" id="submit" type="submit">登 仙</button>
        </form>
      </section>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  /* ===== 灵气粒子 ===== */
  const cv = document.getElementById('qi'), ctx = cv.getContext('2d');
  let W,H,parts;
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  function init(){
    resize();
    parts = Array.from({length:Math.min(90, Math.floor(W*H/16000))},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.8+.4,
      vy:-(Math.random()*.4+.15), vx:(Math.random()-.5)*.25,
      a:Math.random()*.5+.2, c: Math.random()<.5 ? '103,232,249' : '233,200,120'
    }));
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(const p of parts){
      p.y+=p.vy; p.x+=p.vx; p.a+= (Math.random()-.5)*.02;
      if(p.y< -5){ p.y=H+5; p.x=Math.random()*W; }
      if(p.x< -5)p.x=W+5; if(p.x>W+5)p.x=-5;
      ctx.beginPath();
      ctx.fillStyle=`rgba(${p.c},${Math.max(.05,Math.min(.8,p.a))})`;
      ctx.arc(p.x,p.y,p.r,0,7);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  addEventListener('resize',resize); init(); tick();

  /* ===== 境界流转高亮 ===== */
  const realms=[...document.querySelectorAll('#realms span')];
  let ri=0;
  setInterval(()=>{
    realms.forEach(r=>r.classList.remove('on'));
    ri=(ri+1)%realms.length;
    realms[ri].classList.add('on');
  },1600);

  /* ===== 交互 ===== */
  const toast=document.getElementById('toast');
  function show(msg){ toast.textContent=msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),2200); }

  document.getElementById('toggle').addEventListener('click',e=>{
    const p=document.getElementById('pass');
    p.type = p.type==='password'?'text':'password';
    e.target.textContent = p.type==='password'?'显':'隐';
  });

  document.getElementById('loginForm').addEventListener('submit',e=>{
    e.preventDefault();
    const u=document.getElementById('user').value.trim();
    const p=document.getElementById('pass').value;
    const btn=document.getElementById('submit');
    if(!u||!p){ show('道号与法诀缺一不可'); return; }
    btn.disabled=true; btn.textContent='渡劫中…';
    setTimeout(()=>{
      btn.disabled=false; btn.textContent='登 仙';
      show('仙缘已证 · 欢迎归来，'+u);
    },1400);
  });
</script>
</body>
</html>
