spring.application.name=springBootTest
spring.profiles.active=dev

# 显式固定端口（dev 默认 8081，与前端 .env 的 VITE_API_BASE 对齐）
server.port=8081

# ===== 日志 =====
logging.level.root=info
logging.level.com.fenglin.springboottest=warn
logging.file.name=log/xx.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n

# ===== 数据源（本地 MySQL，用户名 root / 密码 123456）=====
spring.datasource.url=jdbc:mysql://localhost:3306/fanren_login?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate（ddl-auto=update：应用启动时自动建/更表 t_user）=====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
